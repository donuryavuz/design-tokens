name: Tokens CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build tokens
        run: |
          npm ci || npm install
          npm run build:tokens

      - name: Drift check (optional)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || (echo "Generated outputs changed. Run npm run build:tokens and commit tokens-dist/." && exit 1)
